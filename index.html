
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BakeBook | Your Recipe Journal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #faf7f2;
      color: #342c28;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: white;
      padding: 36px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(60, 40, 25, 0.08);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 30px;
      color: #754936;
    }

    .subtitle {
      text-align: center;
      color: #82766e;
      margin: 12px 0 28px;
      line-height: 1.5;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: 1px solid #e7ddd5;
      border-radius: 9px;
      background: white;
      color: #754936;
      cursor: pointer;
      font-size: 15px;
    }

    .tab.active {
      background: #754936;
      color: white;
      border-color: #754936;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd2c9;
      border-radius: 9px;
      font-size: 15px;
      background: #fffdfb;
    }

    input:focus {
      outline: 2px solid #c9a58e;
      border-color: #754936;
    }

    .password-help {
      margin: 8px 0;
      color: #82766e;
      font-size: 12px;
      line-height: 1.5;
    }

    .main-button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #754936;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message:empty {
      display: none;
    }

    .signed-in {
      text-align: center;
    }

    .signed-in h2 {
      color: #754936;
    }

    .hidden {
      display: none;
    }

    footer {
      text-align: center;
      color: #9a8c82;
      font-size: 12px;
      margin-top: 24px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 26px 22px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <section id="auth-section">
      <div class="logo" aria-hidden="true">🍰</div>
      <h1>BakeBook</h1>
      <p class="subtitle">
        Your recipes, your memories, your little corner of baking.
      </p>

      <div class="tabs">
        <button type="button" id="signin-tab" class="tab active">
          Sign in
        </button>
        <button type="button" id="signup-tab" class="tab">
          Create account
        </button>
      </div>

      <form id="auth-form">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          minlength="8"
          required
        >

        <p id="password-help" class="password-help hidden">
          Use at least 8 characters, including an uppercase letter,
          a lowercase letter, and a number.
        </p>

        <button type="submit" id="submit-button" class="main-button">
          Sign in
        </button>
      </form>

      <p id="auth-message" class="message" role="status" aria-live="polite"></p>
    </section>

    <section id="signed-in-section" class="signed-in hidden">
      <div class="logo" aria-hidden="true">🍰</div>
      <h1>BakeBook</h1>
      <h2>You're signed in!</h2>
      <p id="welcome-message"></p>
      <p class="subtitle">
        Your account is ready. We'll build your recipe journal next.
      </p>
      <button type="button" id="signout-button" class="main-button">
        Sign out
      </button>
      <p id="session-message" class="message" role="status" aria-live="polite"></p>
    </section>

    <footer>Made for the love of baking ♡</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
